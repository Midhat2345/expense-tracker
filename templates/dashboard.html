{% extends "base.html" %}
{% block content %}

<div class="total-box">
  Total Spent: ₹ {{ total }}
</div>

<div class="filter-box mb-3">
<form class="row g-2">
  <div class="col-md-4">
    <input type="month" name="month" class="form-control">
  </div>
  <div class="col-md-4">
    <select name="category" class="form-control">
      <option value="">All</option>
      <option>Food</option>
      <option>Travel</option>
      <option>Bills</option>
      <option>Shopping</option>
    </select>
  </div>
  <div class="col-md-4">
    <button class="btn btn-primary w-100">Filter</button>
  </div>
</form>
</div>

<div class="card mb-4 chart-box">
  <canvas id="chart" width="300" height="300"></canvas>
</div>

<table class="table table-hover">
<tr>
  <th>Title</th>
  <th>Amount</th>
  <th>Category</th>
  <th>Date</th>
  <th>Actions</th>
</tr>

{% for e in expenses %}
<tr>
  <td>{{ e.title }}</td>
  <td>₹ {{ e.amount }}</td>
  <td>{{ e.category }}</td>
  <td>{{ e.date }}</td>
  <td>
    <a href="/edit/{{ e.id }}" class="btn btn-sm btn-warning">✏️</a>
    <a href="/delete/{{ e.id }}" class="btn btn-sm btn-danger"
       onclick="return confirm('Delete this expense?')">❌</a>
  </td>
</tr>
{% endfor %}
</table>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
new Chart(document.getElementById('chart'), {
    type: 'pie',
    data: {
        labels: {{ summary.keys() | list | safe }},
        datasets: [{
            data: {{ summary.values() | list | safe }},
            backgroundColor: [
                '#d946ef', // magenta
                '#f472b6', // lighter magenta
                '#c026d3', // deep magenta
                '#ec4899', // pink-magenta
                '#a21caf'  // purple-magenta
            ],
            borderWidth: 2,
            borderColor: '#ffffff' // white border between slices
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false, // allows canvas to use fixed size
        plugins: {
            legend: {
                position: 'bottom',
                labels: {
                    color: '#86198f',
                    font: {
                        size: 12,
                        weight: '500'
                    }
                }
            }
        }
    }
});
</script>


{% endblock %}
